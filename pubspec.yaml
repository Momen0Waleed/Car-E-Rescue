name: car_e_rescue
description: "A Flutter project to help people find the best mechanic in case of emergency."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  animated_text_kit: ^4.3.0
  flutter_bounceable: ^1.2.0
  provider: ^6.1.5+1
  animated_custom_dropdown: ^3.1.1
  bot_toast: ^4.1.3
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.0.0
  flutter_easyloading: ^3.0.5
  shared_preferences: ^2.5.4
  lottie: ^3.3.2
  dio: ^5.9.1
  auto_size_text: ^3.0.0
  carousel_slider: ^5.1.2
  geolocator: ^14.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
#        - asset: assets/fonts/Poppins-Regular.ttf
#        - asset: assets/fonts/Poppins-Bold.ttf
#        - asset: assets/fonts/Poppins-Light.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
